[package]
name = "loginflow_sdk"
version = "0.9.0"
edition = "2024"
authors = ["TurnoQR Team"]
description = "SDK for LoginFlow authentication service integration"
license = "MIT"
repository = "https://github.com/LoginFlow/loginflow_sdk"
keywords = ["authentication", "jwt", "actix-web", "loginflow"]
categories = ["authentication", "web-programming"]

[features]
default = ["actix"]
actix = ["actix-web"]

[dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# HTTP Client
reqwest = { version = "0.13.2", features = ["json", "form"] }

# Async
tokio = { version = "1.0", features = ["full"] }

# Error handling
thiserror = "2.0.18"

# Logging
log = "0.4"

# ES256 JWT verification against the LoginFlow JWKS
jsonwebtoken = { version = "11.1", default-features = false, features = ["aws_lc_rs"] }
# Same crypto backend jsonwebtoken already pulls in (feature `aws_lc_rs` above) — used directly
# here only for the RFC 7638 JWK thumbprint and RFC 9449 `ath` hash a DPoP proof needs (SHA-256),
# no new crypto backend introduced.
aws-lc-rs = "1.18"
base64 = "0.22"

# DateTime handling for token and session timestamps

# Actix integration (optional)
actix-web = { version = "4.11", optional = true }
